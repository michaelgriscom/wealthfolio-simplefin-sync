name: CI

on:
  pull_request:
  push:
    # renovate/** so branch automerge has a check to gate on. A Renovate PR
    # also triggers pull_request; the duplicate run is harmless.
    branches: [main, 'renovate/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Mirrors the release bundle job: a lockfile/build break fails the PR
      # here instead of slipping through to a release with no attached bundle.
      # No install scripts (see pnpm-workspace.yaml).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:coverage

      # manifest.json is the version Wealthfolio displays; catch drift from
      # package.json here rather than in a shipped release.
      - name: Check version consistency
        run: pnpm check-version

      - name: Build addon bundle
        run: pnpm bundle
